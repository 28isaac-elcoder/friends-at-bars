name: BarFest
options:
  bundleIdPrefix: com.barfest
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BarFest:
    type: application
    platform: iOS
    sources:
      - path: BarFest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barfest.app
        INFOPLIST_FILE: BarFest/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # set in Xcode / CI
        # Bump CURRENT_PROJECT_VERSION before each App Store / TestFlight upload
        # (must be higher than last uploaded build for com.barfest.app).
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        # Placeholders only — Codemagic overwrites Info.plist from VITE_* env vars
        VITE_SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "YOUR_PUBLISHABLE_KEY"
    # Use existing Info.plist as-is (do not regenerate — preserves version placeholders)
    info:
      path: BarFest/Info.plist
schemes:
  BarFest:
    build:
      targets:
        BarFest: all
    run:
      config: Debug
    archive:
      config: Release
